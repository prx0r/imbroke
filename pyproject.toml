[project]
name = "imbrokeasfuck"
version = "0.1.0"
description = "Crypto AI project tracker — Bittensor, Virtuals, Akash, Venice, and 20+ protocols"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
ibf = "imbrokeasfuck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
